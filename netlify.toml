# Netlify Configuration for Liha Static Site

[build]
  # Netlify's build image ships Chrome for Testing at $CHROME_PATH-compatible
  # locations, but not reliably, so install it explicitly and hand the binary
  # to the prerender step. Without prerendering the site serves an empty
  # <div id="root"> to every crawler, which is the whole SEO problem.
  command = "export CHROME_PATH=$(node scripts/find-chrome.mjs) && npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_DRAWER_ENABLED = "false"
  NETLIFY_FEEDBACK_DISABLED = "true"

[context.production.environment]
  NETLIFY_DRAWER_ENABLED = "false"
  NETLIFY_FEEDBACK_DISABLED = "true"

[context.deploy-preview.environment]
  NETLIFY_DRAWER_ENABLED = "false"
  NETLIFY_FEEDBACK_DISABLED = "true"

[context.branch-deploy.environment]
  NETLIFY_DRAWER_ENABLED = "false"
  NETLIFY_FEEDBACK_DISABLED = "true"

# ---- Netlify badge / HUD / RUM: neutralise at the edge ----
# Netlify injects <script src="/.netlify/scripts/hud"> and
# /.netlify/scripts/rum into every published HTML response, AFTER our build.
# These rules are matched before the SPA catch-all, so the injected tags
# resolve to an empty 204 and the badge iframe is never constructed.
[[redirects]]
  from = "/.netlify/scripts/hud"
  to = "/nf-noop.js"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/scripts/rum"
  to = "/nf-noop.js"
  status = 200
  force = true

# SPA Routing: route all non-file requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets with long TTL
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images with 30-day TTL
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Security Headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.instagram.com; object-src 'none'; base-uri 'self'"
