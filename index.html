    <!--
      Netlify badge / HUD elimination (layer 2 of 2).

      Layer 1 is netlify.toml, which redirects /.netlify/scripts/hud and
      /.netlify/scripts/rum to an empty file so the widget never boots.
      This layer is the belt-and-braces fallback: Netlify injects its badge
      as <iframe id="nl-badge-frame"> (owner toolbar: "nl-hud-frame") pinned
      bottom-right at z-index 2147483645. Selectors below target those real
      ids, plus the legacy netlify-* / feedback-* names.
    -->
    <style>
      #nl-badge-frame, #nl-hud-frame,
      iframe[id^="nl-"], iframe[src*="netlify"], iframe[id*="netlify"],
      #netlify-drawer, .netlify-drawer, [data-netlify-drawer],
      [id^="netlify-drawer"], [class^="netlify-drawer"],
      .netlify-badge, [data-netlify-badge],
      div[id*="netlify"], div[class*="netlify"],
      button[data-testid="feedback-trigger"], div[data-testid="feedback-drawer"],
      [id*="feedback-drawer"], [class*="feedback-drawer"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        left: -99999px !important;
        top: -99999px !important;
        width: 0 !important;
        height: 0 !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function () {
        var SEL = [
          '#nl-badge-frame', '#nl-hud-frame',
          'iframe[id^="nl-"]', 'iframe[src*="netlify"]', 'iframe[id*="netlify"]',
          '#netlify-drawer', '.netlify-drawer', '[data-netlify-drawer]',
          '[id^="netlify-drawer"]', '[class^="netlify-drawer"]',
          '.netlify-badge', '[data-netlify-badge]',
          'div[id*="netlify"]', 'div[class*="netlify"]',
          'button[data-testid="feedback-trigger"]',
          'div[data-testid="feedback-drawer"]'
        ].join(',');

        function kill(root) {
          var nodes = (root || document).querySelectorAll(SEL);
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }
        }

        // The badge remembers dismissal in localStorage; pre-set it so the
        // widget opts itself out even if the script does execute.
        try {
          localStorage.setItem('nl-hud:public:v1', 'hidden');
          localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
        } catch (e) {}

        kill();
        if (window.MutationObserver) {
          new MutationObserver(function () { kill(); })
            .observe(document.documentElement, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', function () { kill(); });
        window.addEventListener('load', function () { kill(); });
      })();
    </script>
