<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Liha's Karuppati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Be Vietnam Pro', -apple-system, sans-serif;
        background-color: #fff8f6;
        color: #231a17;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #d5c3bd;
        border-radius: 20px;
        padding: 3rem 2rem;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(50, 23, 13, 0.08);
      }
      .logo {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        margin-bottom: 1.25rem;
        border: 2px solid #4b2c20;
      }
      .code {
        font-family: 'Literata', serif;
        font-size: 3.5rem;
        font-weight: 700;
        color: #32170d;
        line-height: 1;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: 'Literata', serif;
        font-size: 1.5rem;
        color: #32170d;
        margin-bottom: 0.75rem;
      }
      p {
        color: #504440;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        background-color: #2d5a27;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.85rem 1.8rem;
        border-radius: 8px;
        transition: background-color 0.2s, transform 0.2s;
        box-shadow: 0 4px 14px rgba(45, 90, 39, 0.25);
      }
      .btn:hover {
        background-color: #23471e;
        transform: translateY(-2px);
      }
      .btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/images/logo.webp" alt="Liha's Karuppati" class="logo" />
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for has moved or does not exist. Explore our pure, authentic Palmyra palm offerings on our homepage.</p>
      <a href="/" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
